{% extends "base.html" %}

{% block title %}404 Page Not Found | PayGenius AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="glass-card py-5">
            <h1 class="display-1 fw-bold text-danger mb-3" style="text-shadow: 0 0 15px rgba(220, 53, 69, 0.4);">404</h1>
            <h2 class="text-white mb-4">Resource Not Found</h2>

            <a href="/" class="btn btn-premium rounded-pill px-5 py-2">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
